name: Swift

on:
  push
  
jobs:
  ios-build:
    runs-on: mobile
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Test BSWInterfaceKit iOS
      run: set -o pipefail && SKIP_ZERO=1 xcodebuild -scheme BSWInterfaceKit -destination "platform=iOS Simulator,name=iPhone 16,OS=18.5" test | xcbeautify --renderer github-actions
  
  macos-build:
    runs-on: mobile
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Test BSWInterfaceKit macOS
      run: set -o pipefail && swift build | xcbeautify --renderer github-actions

  android-build:
    runs-on: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Build on Android
        run: skip android build
